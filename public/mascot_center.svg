  <line x1="100" y1="36" x2="100" y2="22" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <line x1="128" y1="52" x2="138" y2="42" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <!-- dark coat body -->
  <path d="M 60 130 C 50 145 35 155 30 165 C 45 175 65 170 80 155 L 75 195 L 125 195 L 120 155 C 135 170 155 175 170 165 C 165 155 150 145 140 130 Z" fill="#1e1f2b" stroke="#111111" stroke-width="4"/>
  <!-- hands raised waving -->
