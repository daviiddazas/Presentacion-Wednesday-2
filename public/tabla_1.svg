<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" style="background:#ffffff; font-family: Calibri, 'Segoe UI', Arial, sans-serif;">
  <!-- Outer Border -->
  <rect x="2" y="2" width="956" height="406" fill="#C9C9C9" stroke="#333333" stroke-width="2"/>

  <!-- Header Background (Black) -->
  <rect x="2" y="2" width="956" height="68" fill="#000000" stroke="#333333" stroke-width="2"/>

  <!-- Vertical Divider Lines -->
  <!-- Divider 1 (between Fecha and Qué ocurre) -->
  <line x1="88" y1="2" x2="88" y2="408" stroke="#444444" stroke-width="1.8"/>
  <!-- Divider 2 (between Qué ocurre and Importancia) -->
  <line x1="535" y1="2" x2="535" y2="408" stroke="#444444" stroke-width="1.8"/>

  <!-- Horizontal Divider Lines -->
  <!-- Below Header -->
  <line x1="2" y1="70" x2="958" y2="70" stroke="#444444" stroke-width="1.8"/>
  <!-- Below Row 1 -->
  <line x1="2" y1="184" x2="958" y2="184" stroke="#555555" stroke-width="1.5"/>
  <!-- Below Row 2 -->
  <line x1="2" y1="298" x2="958" y2="298" stroke="#555555" stroke-width="1.5"/>

  <!-- HEADER TEXT -->
  <text x="14" y="44" fill="#ffffff" font-size="23" font-weight="bold">Fecha</text>
  <text x="100" y="44" fill="#ffffff" font-size="23" font-weight="bold">Qué ocurre</text>
  <text x="548" y="44" fill="#ffffff" font-size="23" font-weight="bold">Importancia para el análisis</text>

  <!-- ROW 1 (1938) -->
  <text x="14" y="142" fill="#000000" font-size="24" font-weight="bold">1938</text>
  <text x="102" y="126" fill="#000000" font-size="21.5">Charles Addams comienza a publicar la</text>
  <text x="102" y="158" fill="#000000" font-size="21.5">familia en <tspan font-style="italic">The New Yorker</tspan></text>
  <text x="550" y="126" fill="#000000" font-size="21.5">Nacimiento de la IP / universo</text>
  <text x="550" y="158" fill="#000000" font-size="21.5">fundacional</text>

  <!-- ROW 2 (1964) -->
  <text x="14" y="258" fill="#000000" font-size="24" font-weight="bold">1964</text>
  <text x="102" y="240" fill="#000000" font-size="21.5">Primera serie televisiva <tspan font-style="italic">The Addams</tspan></text>
  <text x="102" y="272" fill="#000000" font-size="21.5"><tspan font-style="italic">Family</tspan></text>
  <path d="M 102 276 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0" fill="none" stroke="#e53935" stroke-width="1.2" />

  <text x="550" y="240" fill="#000000" font-size="21.5">Primera gran expansión/adaptación</text>
  <text x="550" y="272" fill="#000000" font-size="21.5">intermedial</text>
  <path d="M 550 276 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0 q 2 -2, 4 0 t 4 0" fill="none" stroke="#e53935" stroke-width="1.2" />

  <!-- ROW 3 (2022) -->
  <text x="14" y="368" fill="#000000" font-size="24" font-weight="bold">2022</text>
  <text x="102" y="364" fill="#000000" font-size="21.5">Netflix estrena <tspan font-style="italic">Wednesday</tspan></text>
  <text x="550" y="348" fill="#000000" font-size="21.5">Nueva fase de expansión narrativa</text>
  <text x="550" y="380" fill="#000000" font-size="21.5">deliberada<tspan fill="#000000" font-weight="normal">|</tspan></text>
</svg>